[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flow"
version = "0.1.1"
description = "A momentum-based habit tracker for the terminal."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "LaijieJi" }]
keywords = ["habits", "tracker", "terminal", "tui", "cli", "momentum"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "textual>=0.60",
    "rich>=13.0",
    "click>=8.1",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
flow = "flow.cli:main"

[project.urls]
Homepage = "https://github.com/LaijieJi/flow"
Repository = "https://github.com/LaijieJi/flow"
Issues = "https://github.com/LaijieJi/flow/issues"
Changelog = "https://github.com/LaijieJi/flow/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["flow*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"flow.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
asyncio_mode = "auto"
